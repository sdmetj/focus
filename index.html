<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOCUS</title>
<meta name="description" content="지금 집중할 한 가지와 매일 루틴만 남긴 미니 앱">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FOCUS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
  :root{
    --bg:#0A0A0A;
    --card:#141414;
    --card-hi:#1A1A1A;
    --line:#2A2A2A;
    --line-soft:#232323;
    --text:#F5F5F5;
    --muted:#9E9E9E;
    --dim:#6B6B6B;
    --faint:#4A4A4A;
    --accent:#FFFFFF;
    --ink:#0A0A0A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html{background:var(--bg)}
  body{
    margin:0;
    min-height:100dvh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 28px);
  }
  body::before{
    content:"";
    position:fixed;
    top:-200px;left:50%;transform:translateX(-50%);
    width:520px;height:420px;
    background:radial-gradient(circle, rgba(255,255,255,.055), rgba(255,255,255,0) 68%);
    pointer-events:none;
    z-index:0;
  }
  .app{position:relative;z-index:1;max-width:460px;margin:0 auto}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;user-select:none}
  input{font-family:inherit}
  :focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.34em;color:var(--text)}
  .brand svg{width:15px;height:15px;display:block;filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
  .head-right{display:flex;align-items:center;gap:13px}
  .lang{display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.1em}
  .lang-btn{color:var(--faint);padding:5px 1px;transition:color .16s ease}
  .lang-btn[aria-pressed="true"]{color:var(--text)}
  .lang-btn:active{color:var(--text)}
  .lang-sep{color:#2C2C2C;font-size:9px}
  .date-btn{
    display:flex;align-items:center;gap:5px;
    color:var(--dim);font-size:12px;letter-spacing:.07em;font-variant-numeric:tabular-nums;
    padding:5px 0 5px 1px;transition:color .16s ease;
  }
  .date-btn svg{width:12px;height:12px;display:block;opacity:.8}
  .date-btn:active{color:var(--text)}

  /* section head */
  .eyebrow-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .today-count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* empty compose */
  .compose{display:flex;gap:8px;align-items:stretch}
  .compose input{
    flex:1 1 auto;min-width:0;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 15px;font-size:16px;color:var(--text);
  }
  .compose input::placeholder{color:var(--faint)}
  .compose input:focus{outline:none;border-color:#4A4A4A;background:#161616}

  /* buttons */
  .btn-primary{
    background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;
    padding:0 18px;min-height:52px;border-radius:14px;white-space:nowrap;
    letter-spacing:-.01em;
    transition:transform .12s ease, background .12s ease, opacity .12s ease;
  }
  .btn-primary:active{transform:scale(.97);background:#E2E2E2}
  .btn-ghost{
    border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:500;
    padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.012);
    transition:transform .12s ease,color .12s ease,border-color .12s ease;
  }
  .btn-ghost:active{transform:scale(.97);color:var(--text);border-color:#3A3A3A}

  /* focus card */
  .focus-card{
    position:relative;overflow:hidden;
    background:linear-gradient(162deg,#1C1C1C 0%,#121212 100%);
    border:1px solid #2E2E2E;border-radius:20px;
    padding:20px 20px 18px;
    box-shadow:0 20px 48px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .22s ease, opacity .22s ease;
  }
  .focus-card::after{
    content:"";position:absolute;top:-90px;right:-80px;width:200px;height:200px;
    background:radial-gradient(circle, rgba(255,255,255,.07), rgba(255,255,255,0) 70%);
    pointer-events:none;
  }
  .focus-card.leaving{transform:translateY(-8px) scale(.97);opacity:0}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .tag{
    display:flex;align-items:center;gap:6px;
    font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--muted);
    border:1px solid #333333;background:#1E1E1E;
    border-radius:999px;padding:4px 10px;
  }
  .tag svg{width:9px;height:9px;display:block}
  .elapsed{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .goal-text{
    margin:0 0 20px;font-size:23px;line-height:1.45;font-weight:600;letter-spacing:-.015em;
    color:#FAFAFA;word-break:keep-all;overflow-wrap:anywhere;
  }
  .actions{display:flex;gap:8px;align-items:center}
  .actions .btn-primary{flex:1 1 auto;min-height:50px}

  /* goal edit */
  .goal-edit-input{
    width:100%;background:#0D0D0D;border:1px solid #454545;border-radius:12px;
    padding:14px;font-size:17px;font-weight:500;color:var(--text);margin-bottom:14px;
  }
  .goal-edit-input:focus{outline:none;border-color:#6B6B6B}

  /* queue */
  .queue{margin-top:14px;border-radius:16px;background:#111111;border:1px solid #1F1F1F}
  .queue summary{
    display:flex;align-items:center;gap:8px;list-style:none;
    padding:13px 15px;font-size:13px;color:var(--muted);cursor:pointer;
  }
  .queue summary::-webkit-details-marker{display:none}
  .q-count{
    font-size:11px;font-weight:600;color:var(--dim);background:#1A1A1A;
    border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums;
  }
  .chev{margin-left:auto;color:var(--faint);transition:transform .2s ease;font-size:15px;line-height:1}
  .queue[open] .chev{transform:rotate(90deg)}
  .q-body{padding:0 12px 12px}
  .q-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
  .q-list:empty{display:none}
  .q-item{display:flex;align-items:center;gap:8px;background:#161616;border-radius:11px;padding:9px 8px 9px 12px}
  .q-text{flex:1 1 auto;min-width:0;font-size:14px;color:#CFCFCF;line-height:1.35;overflow-wrap:anywhere}
  .q-btn{
    flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--dim);background:#1D1D1D;border:1px solid #2A2A2A;
  }
  .q-btn.up{color:#F0F0F0;border-color:#3A3A3A}
  .q-btn:active{transform:scale(.94)}
  .q-add{display:flex;gap:7px}
  .q-add input{
    flex:1 1 auto;min-width:0;background:#161616;border:1px solid #262626;border-radius:11px;
    padding:11px 12px;font-size:15px;color:var(--text);
  }
  .q-add input::placeholder{color:var(--faint)}
  .q-add input:focus{outline:none;border-color:#454545}
  .q-add button{
    flex:0 0 auto;width:44px;border-radius:11px;background:#1F1F1F;border:1px solid #2E2E2E;
    color:#EDEDED;font-size:18px;font-weight:400;display:flex;align-items:center;justify-content:center;
  }
  .q-add button:active{transform:scale(.95);background:#282828}

  /* routines */
  .routines{margin-top:40px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .sec-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
  .sec-head .right{display:flex;align-items:center;gap:10px}
  .prog{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .prog.full{color:#FFFFFF}
  .icon-btn{font-size:12px;font-weight:500;color:var(--dim);padding:6px 4px}
  .icon-btn:active{color:var(--text)}
  .bar{height:2px;border-radius:999px;background:#1E1E1E;overflow:hidden;margin-bottom:14px}
  .bar-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#8A8A8A,#FFFFFF);transition:width .35s cubic-bezier(.4,0,.2,1)}
  .r-list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid #202020;border-radius:16px;overflow:hidden}
  .r-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-bottom:1px solid #1C1C1C;font-size:14.5px;line-height:1.4;color:var(--text);background:none;transition:background .15s ease}
  .r-item:last-child{border-bottom:0}
  .r-item:active{background:#181818}
  .check{
    flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid #3D3D3D;
    display:flex;align-items:center;justify-content:center;transition:all .18s ease;
  }
  .check svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:all .18s ease}
  .r-item.done .check{background:#FFFFFF;border-color:#FFFFFF}
  .r-item.done .check svg{opacity:1;transform:scale(1)}
  .r-text{flex:1 1 auto;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
  .r-item.done .r-text{color:#6F6F6F;text-decoration:line-through;text-decoration-color:#4A4A4A;text-decoration-thickness:1px}
  .r-edit{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #1C1C1C}
  .r-edit:last-child{border-bottom:0}
  .r-edit input{
    flex:1 1 auto;min-width:0;background:#0D0D0D;border:1px solid #2E2E2E;border-radius:10px;
    padding:11px 12px;font-size:15px;color:var(--text);
  }
  .r-edit input:focus{outline:none;border-color:#565656}
  .r-del{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid #2E2E2E;color:#8A8A8A;font-size:13px;display:flex;align-items:center;justify-content:center}
  .r-del:active{color:#FFFFFF;border-color:#555555}
  .edit-actions{display:flex;gap:8px;margin-top:12px}
  .edit-actions .btn-primary{flex:1 1 auto;min-height:46px;font-size:14px}
  .edit-actions .btn-ghost{min-height:46px}

  .foot{margin-top:36px;font-size:11px;line-height:1.7;color:#4A4A4A;text-align:center}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    background:#1E1E1E;border:1px solid #333333;color:var(--text);
    font-size:13.5px;font-weight:500;padding:12px 18px;border-radius:999px;
    box-shadow:0 16px 36px rgba(0,0,0,.6);transition:opacity .22s ease,transform .22s ease;
    max-width:calc(100vw - 48px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* calendar modal */
  .cal-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.66);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    display:flex;align-items:flex-end;justify-content:center;
    padding:0 10px calc(env(safe-area-inset-bottom) + 10px);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .cal-overlay.open{opacity:1;pointer-events:auto}
  .cal-sheet{
    width:100%;max-width:460px;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
    background:linear-gradient(180deg,#161616 0%,#101010 100%);
    border:1px solid #2A2A2A;border-radius:22px;
    padding:18px 16px 16px;
    box-shadow:0 -24px 64px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
    transform:translateY(16px);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .cal-overlay.open .cal-sheet{transform:translateY(0)}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-month{font-size:14px;font-weight:600;letter-spacing:.02em;color:#EAEAEA;font-variant-numeric:tabular-nums}
  .cal-nav{display:flex;align-items:center;gap:6px}
  .cal-nav button{
    width:30px;height:30px;border-radius:9px;border:1px solid #262626;
    color:var(--muted);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .cal-nav button:active{color:var(--text);border-color:#3C3C3C}
  .cal-nav .cal-close{border-color:transparent;color:var(--dim);font-size:14px}
  .cal-nav .cal-close:active{border-color:transparent;color:var(--text)}
  .cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-week span{text-align:center;font-size:10.5px;letter-spacing:.06em;color:var(--faint);padding-bottom:7px}
  .cal-day{
    position:relative;height:42px;border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:13px;color:#C6C6C6;font-variant-numeric:tabular-nums;
    transition:background .14s ease,color .14s ease;
  }
  .cal-day.blank{visibility:hidden;pointer-events:none}
  .cal-day:active{background:#1E1E1E}
  .cal-day.today{color:#FFFFFF;font-weight:700;box-shadow:inset 0 0 0 1px #3E3E3E}
  .cal-day.sel{background:#242424;color:#FFFFFF}
  .cal-day.sel.today{box-shadow:inset 0 0 0 1px #5A5A5A}
  .cal-day .dot{width:3px;height:3px;border-radius:50%;background:#DADADA;opacity:0}
  .cal-day.has .dot{opacity:1}
  .cal-detail{margin-top:14px;border-top:1px solid #222222;padding-top:15px}
  .cal-detail:empty{display:none}
  .cal-date{font-size:12.5px;font-weight:600;color:#DCDCDC;margin-bottom:14px;letter-spacing:.02em}
  .det-label{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .det-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .det-row .det-label{margin:0}
  .det-count{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .det-count.full{color:#FFFFFF}
  .det-list{list-style:none;margin:0 0 15px;padding:0;display:flex;flex-direction:column;gap:6px}
  .det-list:last-child{margin-bottom:2px}
  .det-item{
    display:flex;align-items:flex-start;gap:9px;
    background:#171717;border:1px solid #212121;border-radius:11px;
    padding:10px 12px;font-size:13.5px;line-height:1.45;color:#DBDBDB;
    word-break:keep-all;overflow-wrap:anywhere;
  }
  .det-item .tick{flex:0 0 auto;color:#8C8C8C;font-size:11px;line-height:1.7}
  .det-text{flex:1 1 auto;min-width:0}
  .det-time{flex:0 0 auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1.7}
  .det-empty{font-size:12.5px;color:var(--faint);padding:16px 0 8px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6C12.55 7.25 16.75 11.45 22.4 12C16.75 12.55 12.55 16.75 12 22.4C11.45 16.75 7.25 12.55 1.6 12C7.25 11.45 11.45 7.25 12 1.6Z" fill="#FFFFFF"/></svg>
      FOCUS
    </div>
    <div class="head-right">
      <div class="lang" role="group" aria-label="Language / 言語">
        <button class="lang-btn" type="button" data-lang="ko" aria-pressed="true">KR</button>
        <span class="lang-sep" aria-hidden="true">|</span>
        <button class="lang-btn" type="button" data-lang="ja" aria-pressed="false">JP</button>
      </div>
      <button class="date-btn" id="dateBtn" type="button" data-i18n-aria="calOpen">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.4" y="5" width="17.2" height="15.4" rx="3.2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M3.4 9.6h17.2M8 3.4v3.2M16 3.4v3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span id="dateLabel"></span>
      </button>
    </div>
  </header>

  <section>
    <div class="eyebrow-row">
      <span class="eyebrow" data-i18n="nowFocus">지금의 FOCUS</span>
      <span class="today-count" id="todayCount"></span>
    </div>
    <div id="focusRegion"></div>

    <details class="queue" id="queueDrawer">
      <summary>
        <span data-i18n="queue">다음 대기열</span>
        <span class="q-count" id="queueCount">0</span>
        <span class="chev">›</span>
      </summary>
      <div class="q-body">
        <ul class="q-list" id="queueList"></ul>
        <form class="q-add" id="queueForm">
          <input id="queueInput" placeholder="나중에 할 일 적어두기" data-i18n-ph="queuePh" maxlength="120" autocomplete="off" enterkeyhint="done">
          <button type="submit" data-i18n-aria="queueAdd" aria-label="대기열에 추가">＋</button>
        </form>
      </div>
    </details>
  </section>

  <section class="routines">
    <div class="sec-head">
      <h2 data-i18n="routines">매일 루틴</h2>
      <div class="right">
        <span class="prog" id="progLabel">0/5</span>
        <button class="icon-btn" id="editBtn" type="button" data-i18n="editRoutines">편집</button>
      </div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <ul class="r-list" id="routineList"></ul>
    <div class="edit-actions" id="editActions" hidden>
      <button class="btn-ghost" id="addRoutine" type="button" data-i18n="addRoutine">＋ 루틴 추가</button>
      <button class="btn-primary" id="saveRoutines" type="button" data-i18n="save">저장</button>
      <button class="btn-ghost" id="cancelRoutines" type="button" data-i18n="cancel">취소</button>
    </div>
  </section>

  <p class="foot" data-i18n="foot">날짜가 바뀌면 루틴 체크만 새로 시작됩니다 · 이 기기에만 저장</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="cal-overlay" id="calOverlay" hidden>
  <div class="cal-sheet" role="dialog" aria-modal="true" aria-labelledby="calMonth">
    <div class="cal-head">
      <div class="cal-month" id="calMonth"></div>
      <div class="cal-nav">
        <button type="button" id="calPrev" data-i18n-aria="calPrev" aria-label="이전 달">‹</button>
        <button type="button" id="calNext" data-i18n-aria="calNext" aria-label="다음 달">›</button>
        <button type="button" class="cal-close" id="calClose" data-i18n-aria="calClose" aria-label="닫기">✕</button>
      </div>
    </div>
    <div class="cal-week" id="calWeek"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-detail" id="calDetail"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'focus.v1';
  var HISTORY_KEY = 'focus.history.v1';
  var LANG_KEY = 'focus.lang';

  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6C12.55 7.25 16.75 11.45 22.4 12C16.75 12.55 12.55 16.75 12 22.4C11.45 16.75 7.25 12.55 1.6 12C7.25 11.45 11.45 7.25 12 1.6Z" fill="#BFBFBF"/></svg>';

  var DEFAULT_ROUTINES = [
    '기상 후 머리 감기 · 세안',
    '점심 후 양치 · 세안',
    '영양제 챙겨 먹기',
    '일기 · 다이어리 · 성경 1장',
    '독서 (틈틈이)'
  ];
  // 기본 5종의 일본어 표시 (같은 순서)
  var DEFAULT_ROUTINES_JA = [
    '起床後の洗顔・ヘアセット',

  function sameRoutineSet(list, target) {

  /* ---------- history storage ---------- */

  function loadHistory() {
    var raw = null;
    try { raw = localStorage.getItem(HISTORY_KEY); } catch (e) { raw = null; }
    if (!raw) return {};
    var o = null;
    try { o = JSON.parse(raw); } catch (e) { return {}; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) return {};
    var out = {};
    Object.keys(o).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      var e = o[k];
      if (!e || typeof e !== 'object') return;
      var focusDone = Array.isArray(e.focusDone) ? e.focusDone.filter(function (f) {
        return f && typeof f.text === 'string' && f.text.trim();
      }).map(function (f) {
        return {
          text: f.text.trim(),
          completedAt: typeof f.completedAt === 'number' ? f.completedAt : null
        };
      }) : [];
      var routinesDone = Array.isArray(e.routinesDone) ? e.routinesDone.filter(function (n) {
        return typeof n === 'string' && n.trim();
      }).map(function (n) { return n.trim(); }) : [];
      var routineTotal = typeof e.routineTotal === 'number' && e.routineTotal >= 0 ? e.routineTotal : routinesDone.length;
      if (focusDone.length || routinesDone.length) {
        out[k] = { focusDone: focusDone, routinesDone: routinesDone, routineTotal: routineTotal };
      }
    });
    return out;
  }

  function defaults() {

  var state = load();

  function load() {
    var base = defaults();
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (!raw) return base;
    var saved;
    try { saved = JSON.parse(raw); } catch (e) { return base; }
    if (!saved || typeof saved !== 'object') return base;

    var s = base;
    if (typeof saved.goal === 'string' && saved.goal.trim()) {
      s.goal = { text: saved.goal.trim() };
    } else if (saved.goal && typeof saved.goal.text === 'string' && saved.goal.text.trim()) {
      s.goal = { text: saved.goal.text.trim() };
    }
    if (typeof saved.goalStartedAt === 'number') s.goalStartedAt = saved.goalStartedAt;
    if (Array.isArray(saved.routines) && saved.routines.length) {
      var list = saved.routines.filter(function (r) {
        return r && typeof r.text === 'string' && r.text.trim();
      }).map(function (r) {
        var text = r.text.trim();
        var idx = DEFAULT_ROUTINES.indexOf(text);
        var item = { id: typeof r.id === 'string' ? r.id : uid(), text: text, done: !!r.done };
        if (typeof r.dk === 'number' && DEFAULT_ROUTINES[r.dk]) item.dk = r.dk;
        else if (idx >= 0) item.dk = idx;
        return item;
      });
      if (list.length) s.routines = list;
    }
    // 이전 기본 4개를 그대로 쓰던 기기만 새 기본 5개로 교체 (직접 고친 목록은 그대로 둔다)
    if (sameRoutineSet(s.routines, LEGACY_ROUTINES)) {
      s.routines = DEFAULT_ROUTINES.map(function (txt, i) {
        return { id: uid(), text: txt, dk: i, done: false };
      });
    }
    if (Array.isArray(saved.queue)) {
      s.queue = saved.queue.filter(function (txt) { return typeof txt === 'string' && txt.trim(); })
        .map(function (txt) { return txt.trim(); });
    }
    if (Array.isArray(saved.focusDone)) {
      s.focusDone = saved.focusDone.filter(function (f) {
        return f && typeof f.text === 'string' && f.text.trim();
      }).map(function (f) {
        return {
          text: f.text.trim(),
          completedAt: typeof f.completedAt === 'number' ? f.completedAt : null
        };
      });
    }
    if (typeof saved.todayCount === 'number' && saved.todayCount >= 0) s.todayCount = saved.todayCount;
    if (s.focusDone.length) s.todayCount = s.focusDone.length;
    if (typeof saved.date === 'string') s.date = saved.date;

    // 날짜가 바뀌었으면 체크 상태만 초기화 (루틴 텍스트는 유지), 전날 기록은 history로 넘긴다
    if (s.date !== todayKey()) {
      var prevKey = s.date;
      var prevRoutines = s.routines.filter(function (r) { return r.done; }).map(function (r) { return r.text; });
      var prevFocus = s.focusDone;
      if (prevFocus.length || prevRoutines.length) {
        var prevEntry = history[prevKey];
        var hadContent = prevEntry && ((prevEntry.focusDone && prevEntry.focusDone.length) || (prevEntry.routinesDone && prevEntry.routinesDone.length));
        if (!hadContent) {
          history[prevKey] = {
            focusDone: prevFocus.slice(),
            routinesDone: prevRoutines,
            routineTotal: s.routines.length
          };
          saveHistory();
        }
      }
      s.date = todayKey();
      s.routines.forEach(function (r) { r.done = false; });
      s.todayCount = 0;
      s.focusDone = [];
    }
    if (s.goal && typeof s.goalStartedAt !== 'number') s.goalStartedAt = Date.now();
    return s;
  }

  function save() {

  /* ---------- today's record ---------- */

  function todayEntry() {
    return {
      focusDone: state.focusDone.map(function (f) {

      routinesDone: state.routines.filter(function (r) { return r.done; }).map(function (r) { return r.text; }),

  function saveDayEntry(key, entry) {
    var has = entry && entry.focusDone && (entry.focusDone.length || entry.routinesDone.length);
    if (!has) {
      if (history[key]) { delete history[key]; saveHistory(); }
      return;
    }
    history[key] = entry;
    saveHistory();
  }

    saveDayEntry(todayKey(), todayEntry());

    }
    if (m < 1) return t('justStarted');

  function renderCalDetail() {
    var wrap = $('calDetail');
    if (!cal.sel) { wrap.innerHTML = ''; return; }
    var parts = cal.sel.split('-');
    var y = parseInt(parts[0], 10), mo = parseInt(parts[1], 10), da = parseInt(parts[2], 10);
    var dt = new Date(y, mo - 1, da);
    var wd = WEEK[lang][dt.getDay()];
    var title = (lang === 'ja')
      ? (mo + '月' + da + '日（' + wd + '）')
      : (mo + '월 ' + da + '일 (' + wd + ')');

    var e = entryFor(cal.sel);
    var focusList = (e && e.focusDone) ? e.focusDone : [];
    var routinesDone = (e && e.routinesDone) ? e.routinesDone : [];
    var routineTotal = (e && typeof e.routineTotal === 'number') ? e.routineTotal : state.routines.length;

    var html = '<div class="cal-date">' + esc(title) + '</div>';

    if (!focusList.length && !routinesDone.length) {
      html += '<div class="det-empty">' + esc(t('calEmpty')) + '</div>';
      wrap.innerHTML = html;
      return;
    }

    if (focusList.length) {
      html += '<p class="det-label">' + esc(t('calFocus')) + '</p><ul class="det-list">';
      focusList.forEach(function (f) {
        var tm = timeHM(f.completedAt);
        html += '<li class="det-item"><span class="tick">✓</span>' +
          '<span class="det-text">' + esc(f.text) + '</span>' +
          (tm ? '<span class="det-time">' + tm + '</span>' : '') +
        '</li>';
      });
      html += '</ul>';
    }

    if (routineTotal > 0) {
      var full = routinesDone.length >= routineTotal;
      html += '<div class="det-row">' +
        '<p class="det-label">' + esc(t('calRoutines')) + '</p>' +
        '<span class="det-count' + (full ? ' full' : '') + '">' + routinesDone.length + '/' + routineTotal + '</span>' +
      '</div>';
      if (routinesDone.length) {
        html += '<ul class="det-list">';
        routinesDone.forEach(function (name) {
          html += '<li class="det-item"><span class="tick">✓</span><span class="det-text">' +
            esc(routineNameJa(name)) + '</span></li>';
        });
        html += '</ul>';
      } else {
        html += '<div class="det-empty" style="padding-top:2px">' + esc(lang === 'ja' ? 'まだチェックはありません' : '아직 체크한 루틴이 없어요') + '</div>';
      }
    }

    wrap.innerHTML = html;
  }

  function openCal() {
    var d = new Date();
    cal.y = d.getFullYear();
    cal.m = d.getMonth();
    cal.sel = todayKey();
    cal.isOpen = true;
    var ov = $('calOverlay');
    ov.hidden = false;
    renderCal();
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () { ov.classList.add('open'); });
    } else {
      ov.classList.add('open');
    }
    document.body.style.overflow = 'hidden';
  }

  function closeCal() {
    if (!cal.isOpen) return;
    cal.isOpen = false;
    var ov = $('calOverlay');
    ov.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () { if (!cal.isOpen) ov.hidden = true; }, 240);
  }

  function shiftMonth(delta) {
    var m = cal.m + delta;
    var y = cal.y;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    cal.y = y; cal.m = m;
    renderCal();
  }

  /* ---------- render all ---------- */

  function applyStaticI18n() {
    document.documentElement.lang = (lang === 'ja') ? 'ja' : 'ko';
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    }
    var phs = document.querySelectorAll('[data-i18n-ph]');
    for (var j = 0; j < phs.length; j++) {
      phs[j].setAttribute('placeholder', t(phs[j].getAttribute('data-i18n-ph')));
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var k = 0; k < arias.length; k++) {
      arias[k].setAttribute('aria-label', t(arias[k].getAttribute('data-i18n-aria')));
    }
    var btns = document.querySelectorAll('.lang-btn');
    for (var b = 0; b < btns.length; b++) {
      btns[b].setAttribute('aria-pressed', btns[b].getAttribute('data-lang') === lang ? 'true' : 'false');
    }
  }

  function renderAll() {
    $('dateLabel').textContent = dateLabelText();
    renderFocus();
    renderQueue();
    renderRoutines();
    if (cal.isOpen) renderCal();
  }

  function setLang(next) {
    if (next !== 'ko' && next !== 'ja') return;
    if (lang === next) return;
    lang = next;
    saveLang();
    if (editMode && draft) {
      // 편집 중이면 입력값을 지금 언어 표기로 다시 그린다
      renderRoutines();
    }
    applyStaticI18n();
    renderAll();
  }

  /* ---------- events ---------- */

  document.querySelector('.lang').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-lang]');
    if (!btn) return;
    setLang(btn.getAttribute('data-lang'));
  });

  $('dateBtn').addEventListener('click', openCal);
  $('calClose').addEventListener('click', closeCal);
  $('calPrev').addEventListener('click', function () { shiftMonth(-1); });
  $('calNext').addEventListener('click', function () { shiftMonth(1); });
  $('calOverlay').addEventListener('click', function (e) {
    if (e.target === $('calOverlay')) closeCal();
  });
  $('calGrid').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-day]');
    if (!btn) return;
    cal.sel = btn.getAttribute('data-day');
    var p = cal.sel.split('-');
    cal.y = parseInt(p[0], 10);
    cal.m = parseInt(p[1], 10) - 1;
    renderCal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && cal.isOpen) closeCal();
  });

  $('focusRegion').addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'composeForm') {
      var input = $('goalInput');
      if (setGoal(input ? input.value : '')) {
        toastKey('toastStart');
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
      } else if (input) {
        input.focus();
        toastKey('toastNeedOne');
      }
    } else if (e.target.id === 'goalEditForm') {
      var v = $('goalEditInput');
      var text = v ? v.value.trim() : '';
      if (!text) { renderFocus(); return; }
      state.goal = { text: text };
      save();
      renderAll();
      toastKey('toastEdited');
    }
  });

  $('focusRegion').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'complete') completeGoal();
    else if (act === 'edit') renderGoalEdit();
    else if (act === 'cancelEdit') renderFocus();
    else if (act === 'clear') {
      state.goal = null;
      state.goalStartedAt = null;
      save();
      renderAll();
      toastKey('toastCleared');
    }
  });

  $('queueForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('queueInput');
    var v = input ? input.value.trim() : '';
    if (!v) return;
    state.queue.push(v);
    save();
    renderQueue();
    input.value = '';
    $('queueDrawer').open = true;
    toastKey('toastQueued');
  });

  $('queueList').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-q]');
    if (!btn) return;
    var i = parseInt(btn.getAttribute('data-i'), 10);
    var kind = btn.getAttribute('data-q');
    if (isNaN(i) || !state.queue[i]) return;
    if (kind === 'up') {
      var text = state.queue.splice(i, 1)[0];
      setGoal(text);
      toastKey('toastRaised');
    } else if (kind === 'del') {
      state.queue.splice(i, 1);
      save();
      renderQueue();
    }
  });

  $('routineList').addEventListener('click', function (e) {
    if (editMode) {
      var del = e.target.closest('[data-del]');
      if (del) {
        var di = parseInt(del.getAttribute('data-del'), 10);
        if (!isNaN(di)) {
          draft.splice(di, 1);
          renderRoutines();
        }
      }
      return;
    }
    var btn = e.target.closest('[data-toggle]');
    if (!btn) return;
    var id = btn.getAttribute('data-toggle');
    var r = state.routines.find(function (x) { return x.id === id; });
    if (!r) return;
    r.done = !r.done;
    syncToday();
    save();
    renderRoutines();
    if (r.done && navigator.vibrate) { try { navigator.vibrate(10); } catch (err) {} }
  });

  $('routineList').addEventListener('input', function (e) {
    if (!editMode) return;
    var input = e.target.closest('.r-input');
    if (!input) return;
    var i = parseInt(input.getAttribute('data-i'), 10);
    if (!isNaN(i) && draft[i]) draft[i].text = input.value;
  });

  $('editBtn').addEventListener('click', function () {
    editMode = true;
    draft = state.routines.map(function (r) {
      var c = { id: r.id, text: r.text, done: r.done };
      if (typeof r.dk === 'number') c.dk = r.dk;
      return c;
    });
    renderRoutines();
  });

  $('cancelRoutines').addEventListener('click', function () {
    editMode = false;
    draft = null;
    renderRoutines();
  });

  $('addRoutine').addEventListener('click', function () {
    draft.push({ id: uid(), text: '', done: false });
    renderRoutines();
    var inputs = $('routineList').querySelectorAll('.r-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  $('saveRoutines').addEventListener('click', function () {
    var clean = draft.filter(function (r) { return r.text.trim(); }).map(normalizeRoutine);
    state.routines = clean;
    syncToday();
    save();
    editMode = false;
    draft = null;
    renderRoutines();
    if (cal.isOpen) renderCal();
    toastKey('toastSaved');
  });

  // 날짜 전환 감지
  function checkRollover() {
    if (state.date !== todayKey()) {
      saveDayEntry(state.date, todayEntry());   // 전날 기존 날짜 그대로 기록을 확정
      state.date = todayKey();
      state.routines.forEach(function (r) { r.done = false; });
      state.todayCount = 0;
      state.focusDone = [];
      save();
      renderAll();
      toastKey('toastNewDay');
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) checkRollover();
  });
  setInterval(checkRollover, 30000);

  // 경과 시간 갱신
  setInterval(function () {
    var el = $('elapsed');
    if (el) el.textContent = elapsedText();
  }, 20000);

  applyStaticI18n();
  syncToday();
  renderAll();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
