<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOCUS</title>
<meta name="description" content="지금 집중할 한 가지와 매일 루틴만 남긴 미니 앱">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FOCUS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
  :root{
    --bg:#0A0A0A;
    --card:#141414;
    --card-hi:#1A1A1A;
    --line:#2A2A2A;
    --line-soft:#232323;
    --text:#F5F5F5;
    --muted:#9E9E9E;
    --dim:#6B6B6B;
    --faint:#4A4A4A;
    --accent:#FFFFFF;
    --ink:#0A0A0A;
    /* equipped star skin */
    --star:#FFFFFF;
    --tag-star:#BFBFBF;
    --star-glow:rgba(255,255,255,.25);
    --tag-glow:rgba(255,255,255,0);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html{background:var(--bg)}
  body{
    margin:0;
    min-height:100dvh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 28px);
  }
  body::before{
    content:"";
    position:fixed;
    top:-200px;left:50%;transform:translateX(-50%);
    width:520px;height:420px;
    background:radial-gradient(circle, rgba(255,255,255,.055), rgba(255,255,255,0) 68%);
    pointer-events:none;
    z-index:0;
  }
  .app{position:relative;z-index:1;max-width:460px;margin:0 auto}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;user-select:none}
  input{font-family:inherit}
  :focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}
  .brand{
    position:relative;display:flex;align-items:center;gap:9px;
    margin:-6px 0;padding:6px 4px 6px 0;border-radius:10px;
    font-size:13px;font-weight:700;letter-spacing:.34em;color:var(--text);
    -webkit-appearance:none;appearance:none;transition:opacity .16s ease;
  }
  .brand:active{opacity:.7}
  .brand svg{width:15px;height:15px;display:block;filter:drop-shadow(0 0 6px var(--star-glow));transition:filter .3s ease}
  .brand svg path{fill:var(--star);transition:fill .3s ease}
  .tag svg{filter:drop-shadow(0 0 4px var(--tag-glow));transition:filter .3s ease}
  .tag svg path{fill:var(--tag-star);transition:fill .3s ease}
  .brand-dot{
    position:absolute;left:12px;top:3px;width:6px;height:6px;border-radius:50%;
    background:#FFFFFF;box-shadow:0 0 8px rgba(255,255,255,.8);
    animation:badgePulse 2.4s ease-in-out infinite;pointer-events:none;
  }
  @keyframes badgePulse{0%,100%{opacity:.6;transform:scale(.82)}50%{opacity:1;transform:scale(1)}}

  /* ---------- equipped star skins ---------- */
  body[data-skin="silver"]{--star:#E7EDF4;--tag-star:#DCE4EC;--star-glow:rgba(206,224,240,.5);--tag-glow:rgba(206,224,240,.34)}
  body[data-skin="ash"]{--star:#C6CBD1;--tag-star:#B4BAC1;--star-glow:rgba(202,208,216,.42);--tag-glow:rgba(202,208,216,.28)}
  body[data-skin="sky"]{--star:#7DD3FC;--tag-star:#7DD3FC;--star-glow:rgba(125,211,252,.5);--tag-glow:rgba(125,211,252,.4)}
  body[data-skin="mint"]{--star:#6EE7B7;--tag-star:#6EE7B7;--star-glow:rgba(110,231,183,.46);--tag-glow:rgba(110,231,183,.38)}
  body[data-skin="lavender"]{--star:#C4B5FD;--tag-star:#C4B5FD;--star-glow:rgba(196,181,253,.48);--tag-glow:rgba(196,181,253,.4)}
  body[data-skin="blue"]{--star:#AFCDF0;--tag-star:#A9C8EE;--star-glow:rgba(160,200,250,.5);--tag-glow:rgba(160,200,250,.36)}
  body[data-skin="rose"]{--star:#F2B6CB;--tag-star:#F0AFC7;--star-glow:rgba(244,168,198,.48);--tag-glow:rgba(244,168,198,.36)}
  body[data-skin="coral"]{--star:#FDA4AF;--tag-star:#FDA4AF;--star-glow:rgba(253,164,175,.5);--tag-glow:rgba(253,164,175,.4)}
  body[data-skin="amber"]{--star:#FCD34D;--tag-star:#FCD34D;--star-glow:rgba(252,211,77,.5);--tag-glow:rgba(252,211,77,.4)}
  body[data-skin="gold"]{--star:#FFD466;--tag-star:#FFD166;--star-glow:rgba(255,206,84,.6);--tag-glow:rgba(255,206,84,.48)}
  body[data-skin="aurora"]{--star:#C4B5FD;--tag-star:#C4B5FD;--star-glow:rgba(178,160,255,.58);--tag-glow:rgba(178,160,255,.45)}
  body[data-skin="neon"]{--star:#67E8F9;--tag-star:#67E8F9;--star-glow:rgba(103,232,249,.6);--tag-glow:rgba(103,232,249,.5)}
  body[data-skin="orbit"]{--star:#E4EAF2;--tag-star:#DDE4EE;--star-glow:rgba(214,226,240,.5);--tag-glow:rgba(214,226,240,.38)}
  body[data-skin="stardust"]{--star:#E8EEFF;--tag-star:#E2E9FF;--star-glow:rgba(200,214,255,.55);--tag-glow:rgba(200,214,255,.42)}
  body[data-skin="snow"]{--star:#EAF6FF;--tag-star:#E4F2FF;--star-glow:rgba(190,230,255,.55);--tag-glow:rgba(190,230,255,.42)}
  body[data-skin="crescent"]{--star:#F0DAA8;--tag-star:#EFD7A2;--star-glow:rgba(240,214,160,.55);--tag-glow:rgba(240,214,160,.42)}
  body[data-skin="midnight"]{--star:#9DBCFF;--tag-star:#9DBCFF;--star-glow:rgba(120,150,255,.6);--tag-glow:rgba(120,150,255,.48)}
  body[data-skin="aurora"] .brand svg path,
  body[data-skin="aurora"] .tag svg path{fill:url(#starAurora)}
  @keyframes starBreathe{0%,100%{opacity:.74;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
  @keyframes starTwinkle{0%,100%{opacity:.5}42%{opacity:1}58%{opacity:.92}}
  @keyframes starGlowPulse{0%,100%{filter:drop-shadow(0 0 5px var(--star-glow))}50%{filter:drop-shadow(0 0 14px var(--star-glow))}}
  @keyframes auroraShift{0%{filter:drop-shadow(0 0 7px var(--star-glow)) hue-rotate(0deg)}100%{filter:drop-shadow(0 0 7px var(--star-glow)) hue-rotate(360deg)}}
  @keyframes sparkDot{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.9;transform:scale(1)}}
  body[data-skin="silver"] .brand svg,body[data-skin="silver"] .tag svg{animation:starBreathe 4.4s ease-in-out infinite}
  body[data-skin="ash"] .brand svg,body[data-skin="ash"] .tag svg{animation:starTwinkle 3.4s ease-in-out infinite}
  body[data-skin="blue"] .brand svg,body[data-skin="blue"] .tag svg{animation:starGlowPulse 4.6s ease-in-out infinite}
  body[data-skin="rose"] .brand svg,body[data-skin="rose"] .tag svg{animation:starBreathe 4.8s ease-in-out infinite}
  body[data-skin="gold"] .brand svg,body[data-skin="gold"] .tag svg{animation:starGlowPulse 2.6s ease-in-out infinite}
  body[data-skin="aurora"] .brand svg,body[data-skin="aurora"] .tag svg{animation:auroraShift 7s linear infinite}
  body[data-skin="neon"] .brand svg,body[data-skin="neon"] .tag svg{animation:starGlowPulse 2.2s ease-in-out infinite}
  body[data-skin="stardust"] .brand svg,body[data-skin="stardust"] .tag svg{animation:starBreathe 5.6s ease-in-out infinite}
  body[data-skin="snow"] .brand svg,body[data-skin="snow"] .tag svg{animation:starTwinkle 5s ease-in-out infinite}
  body[data-skin="crescent"] .brand svg,body[data-skin="crescent"] .tag svg{animation:starBreathe 5.2s ease-in-out infinite}
  body[data-skin="midnight"] .brand svg,body[data-skin="midnight"] .tag svg{animation:starGlowPulse 5.5s ease-in-out infinite}

  /* 별 주변 이펙트 — 헤더·도감 카드·결과창 공통 */
  .fx{position:relative;display:flex;align-items:center;justify-content:center;line-height:0}
  .fx::before,.fx::after{content:"";position:absolute;pointer-events:none}
  .fx-orbit::before{
    inset:-24%;border-radius:50%;border:1px solid rgba(224,232,244,.55);
    transform:rotate(18deg) scaleY(.52);animation:orbitSpin 7s linear infinite;
  }
  @keyframes orbitSpin{from{transform:rotate(18deg) scaleY(.52)}to{transform:rotate(378deg) scaleY(.52)}}
  .fx-stardust::after{
    inset:-38%;opacity:.6;
    background:
      radial-gradient(circle 1.1px at 12% 24%,#FFFFFF 0 60%,transparent 61%),
      radial-gradient(circle .9px at 88% 30%,#FFFFFF 0 60%,transparent 61%),
      radial-gradient(circle .8px at 58% 96%,#FFFFFF 0 60%,transparent 61%);
    animation:dustTwinkle 3s ease-in-out infinite;
  }
  @keyframes dustTwinkle{0%,100%{opacity:.22}50%{opacity:1}}
  .fx-snow::after{
    inset:-26%;opacity:.5;
    background:
      radial-gradient(circle 1px at 50% 0,#EAF6FF 0 60%,transparent 61%),
      radial-gradient(circle 1px at 50% 100%,#EAF6FF 0 60%,transparent 61%),
      radial-gradient(circle 1px at 0 50%,#EAF6FF 0 60%,transparent 61%),
      radial-gradient(circle 1px at 100% 50%,#EAF6FF 0 60%,transparent 61%);
    animation:snowGlint 3.8s ease-in-out infinite;
  }
  @keyframes snowGlint{0%,100%{opacity:.28;transform:scale(.9)}50%{opacity:.95;transform:scale(1.06)}}
  .fx-crescent::before{
    width:54%;height:54%;top:-30%;left:-26%;
    background:radial-gradient(circle at 70% 30%,transparent 0 48%,#F0DAA8 51%);
    animation:crescentFloat 5s ease-in-out infinite;
  }
  @keyframes crescentFloat{0%,100%{transform:translateY(0) rotate(-8deg);opacity:.65}50%{transform:translateY(-1px) rotate(-16deg);opacity:1}}
  .fx-spark::after{
    left:-8%;top:-18%;width:16%;height:16%;border-radius:50%;
    background:radial-gradient(circle,#FFFFFF 0%,rgba(255,255,255,0) 72%);
    animation:sparkDot 2.6s ease-in-out infinite;
  }
  body[data-skin="aurora"] .fx-spark::after{animation-delay:.8s}

  /* midnight — 장착 시 앱 상단·FOCUS 카드에 밤하늘 무드 */
  html[data-skin="midnight"]{background:#070A12}
  body[data-skin="midnight"]{background:#080C16;transition:background .45s ease}
  body[data-skin="midnight"]::before{background:radial-gradient(circle, rgba(84,118,220,.18), rgba(30,50,120,0) 68%)}
  body[data-skin="midnight"] .focus-card{
    border-color:#2C3E68;
    background:linear-gradient(162deg,#131C30 0%,#0A1020 100%);
    box-shadow:0 20px 48px rgba(0,0,0,.7), inset 0 1px 0 rgba(150,180,255,.10);
  }
  body[data-skin="midnight"] .focus-card::after{background:radial-gradient(circle, rgba(120,160,255,.13), rgba(255,255,255,0) 70%)}
  .head-right{display:flex;align-items:center;gap:13px}
  .lang{display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.1em}
  .lang-btn{color:var(--faint);padding:5px 1px;transition:color .16s ease}
  .lang-btn[aria-pressed="true"]{color:var(--text)}
  .lang-btn:active{color:var(--text)}
  .lang-sep{color:#2C2C2C;font-size:9px}
  .date-btn{
    display:flex;align-items:center;gap:5px;
    color:var(--dim);font-size:12px;letter-spacing:.07em;font-variant-numeric:tabular-nums;
    padding:5px 0 5px 1px;transition:color .16s ease;
  }
  .date-btn svg{width:12px;height:12px;display:block;opacity:.8}
  .date-btn:active{color:var(--text)}

  /* section head */
  .eyebrow-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .today-count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* empty compose */
  .compose{display:flex;gap:8px;align-items:stretch}
  .compose input{
    flex:1 1 auto;min-width:0;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 15px;font-size:16px;color:var(--text);
  }
  .compose input::placeholder{color:var(--faint)}
  .compose input:focus{outline:none;border-color:#4A4A4A;background:#161616}

  /* buttons */
  .btn-primary{
    background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;
    padding:0 18px;min-height:52px;border-radius:14px;white-space:nowrap;
    letter-spacing:-.01em;
    transition:transform .12s ease, background .12s ease, opacity .12s ease;
  }
  .btn-primary:active{transform:scale(.97);background:#E2E2E2}
  .btn-ghost{
    border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:500;
    padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.012);
    transition:transform .12s ease,color .12s ease,border-color .12s ease;
  }
  .btn-ghost:active{transform:scale(.97);color:var(--text);border-color:#3A3A3A}

  /* focus card */
  .focus-card{
    position:relative;overflow:hidden;
    background:linear-gradient(162deg,#1C1C1C 0%,#121212 100%);
    border:1px solid #2E2E2E;border-radius:20px;
    padding:20px 20px 18px;
    box-shadow:0 20px 48px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .22s ease, opacity .22s ease;
  }
  .focus-card::after{
    content:"";position:absolute;top:-90px;right:-80px;width:200px;height:200px;
    background:radial-gradient(circle, rgba(255,255,255,.07), rgba(255,255,255,0) 70%);
    pointer-events:none;
  }
  .focus-card.leaving{transform:translateY(-8px) scale(.97);opacity:0}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .tag{
    display:flex;align-items:center;gap:6px;
    font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--muted);
    border:1px solid #333333;background:#1E1E1E;
    border-radius:999px;padding:4px 10px;
  }
  .tag svg{width:9px;height:9px;display:block}
  .elapsed{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .goal-text{
    margin:0 0 20px;font-size:23px;line-height:1.45;font-weight:600;letter-spacing:-.015em;
    color:#FAFAFA;word-break:keep-all;overflow-wrap:anywhere;
  }
  .actions{display:flex;gap:8px;align-items:center}
  .actions .btn-primary{flex:1 1 auto;min-height:50px}

  /* goal edit */
  .goal-edit-input{
    width:100%;background:#0D0D0D;border:1px solid #454545;border-radius:12px;
    padding:14px;font-size:17px;font-weight:500;color:var(--text);margin-bottom:14px;
  }
  .goal-edit-input:focus{outline:none;border-color:#6B6B6B}

  /* queue */
  .queue{margin-top:14px;border-radius:16px;background:#111111;border:1px solid #1F1F1F}
  .queue summary{
    display:flex;align-items:center;gap:8px;list-style:none;
    padding:13px 15px;font-size:13px;color:var(--muted);cursor:pointer;
  }
  .queue summary::-webkit-details-marker{display:none}
  .q-count{
    font-size:11px;font-weight:600;color:var(--dim);background:#1A1A1A;
    border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums;
  }
  .chev{margin-left:auto;color:var(--faint);transition:transform .2s ease;font-size:15px;line-height:1}
  .queue[open] .chev{transform:rotate(90deg)}
  .q-body{padding:0 12px 12px}
  .q-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
  .q-list:empty{display:none}
  .q-item{display:flex;align-items:center;gap:8px;background:#161616;border-radius:11px;padding:9px 8px 9px 12px}
  .q-text{flex:1 1 auto;min-width:0;font-size:14px;color:#CFCFCF;line-height:1.35;overflow-wrap:anywhere}
  .q-btn{
    flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--dim);background:#1D1D1D;border:1px solid #2A2A2A;
  }
  .q-btn.up{color:#F0F0F0;border-color:#3A3A3A}
  .q-btn:active{transform:scale(.94)}
  .q-add{display:flex;gap:7px}
  .q-add input{
    flex:1 1 auto;min-width:0;background:#161616;border:1px solid #262626;border-radius:11px;
    padding:11px 12px;font-size:15px;color:var(--text);
  }
  .q-add input::placeholder{color:var(--faint)}
  .q-add input:focus{outline:none;border-color:#454545}
  .q-add button{
    flex:0 0 auto;width:44px;border-radius:11px;background:#1F1F1F;border:1px solid #2E2E2E;
    color:#EDEDED;font-size:18px;font-weight:400;display:flex;align-items:center;justify-content:center;
  }
  .q-add button:active{transform:scale(.95);background:#282828}

  /* routines */
  .routines{margin-top:40px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .sec-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
  .sec-head .right{display:flex;align-items:center;gap:10px}
  .prog{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .prog.full{color:#FFFFFF}
  .icon-btn{font-size:12px;font-weight:500;color:var(--dim);padding:6px 4px}
  .icon-btn:active{color:var(--text)}
  .bar{height:2px;border-radius:999px;background:#1E1E1E;overflow:hidden;margin-bottom:14px}
  .bar-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#8A8A8A,#FFFFFF);transition:width .35s cubic-bezier(.4,0,.2,1)}
  .r-list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid #202020;border-radius:16px;overflow:hidden}
  .r-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-bottom:1px solid #1C1C1C;font-size:14.5px;line-height:1.4;color:var(--text);background:none;transition:background .15s ease}
  .r-item:last-child{border-bottom:0}
  .r-item:active{background:#181818}
  .check{
    flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid #3D3D3D;
    display:flex;align-items:center;justify-content:center;transition:all .18s ease;
  }
  .check svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:all .18s ease}
  .r-item.done .check{background:#FFFFFF;border-color:#FFFFFF}
  .r-item.done .check svg{opacity:1;transform:scale(1)}
  .r-text{flex:1 1 auto;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
  .r-item.done .r-text{color:#6F6F6F;text-decoration:line-through;text-decoration-color:#4A4A4A;text-decoration-thickness:1px}
  .r-edit{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #1C1C1C}
  .r-edit:last-child{border-bottom:0}
  .r-edit input{
    flex:1 1 auto;min-width:0;background:#0D0D0D;border:1px solid #2E2E2E;border-radius:10px;
    padding:11px 12px;font-size:15px;color:var(--text);
  }
  .r-edit input:focus{outline:none;border-color:#565656}
  .r-del{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid #2E2E2E;color:#8A8A8A;font-size:13px;display:flex;align-items:center;justify-content:center}
  .r-del:active{color:#FFFFFF;border-color:#555555}
  .edit-actions{display:flex;gap:8px;margin-top:12px}
  .edit-actions .btn-primary{flex:1 1 auto;min-height:46px;font-size:14px}
  .edit-actions .btn-ghost{min-height:46px}

  .foot{margin-top:36px;font-size:11px;line-height:1.7;color:#4A4A4A;text-align:center}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    background:#1E1E1E;border:1px solid #333333;color:var(--text);
    font-size:13.5px;font-weight:500;padding:12px 18px;border-radius:999px;
    box-shadow:0 16px 36px rgba(0,0,0,.6);transition:opacity .22s ease,transform .22s ease;
    max-width:calc(100vw - 48px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* calendar modal */
  .cal-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.66);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    display:flex;align-items:flex-end;justify-content:center;
    padding:0 10px calc(env(safe-area-inset-bottom) + 10px);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .cal-overlay.open{opacity:1;pointer-events:auto}
  .cal-sheet{
    width:100%;max-width:460px;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
    background:linear-gradient(180deg,#161616 0%,#101010 100%);
    border:1px solid #2A2A2A;border-radius:22px;
    padding:18px 16px 16px;
    box-shadow:0 -24px 64px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
    transform:translateY(16px);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .cal-overlay.open .cal-sheet{transform:translateY(0)}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-month{font-size:14px;font-weight:600;letter-spacing:.02em;color:#EAEAEA;font-variant-numeric:tabular-nums}
  .cal-nav{display:flex;align-items:center;gap:6px}
  .cal-nav button{
    width:30px;height:30px;border-radius:9px;border:1px solid #262626;
    color:var(--muted);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .cal-nav button:active{color:var(--text);border-color:#3C3C3C}
  .cal-nav .cal-close{border-color:transparent;color:var(--dim);font-size:14px}
  .cal-nav .cal-close:active{border-color:transparent;color:var(--text)}
  .cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-week span{text-align:center;font-size:10.5px;letter-spacing:.06em;color:var(--faint);padding-bottom:7px}
  .cal-day{
    position:relative;height:42px;border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:13px;color:#C6C6C6;font-variant-numeric:tabular-nums;
    transition:background .14s ease,color .14s ease;
  }
  .cal-day.blank{visibility:hidden;pointer-events:none}
  .cal-day:active{background:#1E1E1E}
  .cal-day.today{color:#FFFFFF;font-weight:700;box-shadow:inset 0 0 0 1px #3E3E3E}
  .cal-day.sel{background:#242424;color:#FFFFFF}
  .cal-day.sel.today{box-shadow:inset 0 0 0 1px #5A5A5A}
  .cal-day .dot{width:3px;height:3px;border-radius:50%;background:#DADADA;opacity:0}
  .cal-day.has .dot{opacity:1}

  .det-label{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .det-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .det-row .det-label{margin:0}
  .det-count{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .det-count.full{color:#FFFFFF}
  .det-list{list-style:none;margin:0 0 15px;padding:0;display:flex;flex-direction:column;gap:6px}
  .det-list:last-child{margin-bottom:2px}
  .det-item{
    display:flex;align-items:flex-start;gap:9px;
    background:#171717;border:1px solid #212121;border-radius:11px;
    padding:10px 12px;font-size:13.5px;line-height:1.45;color:#DBDBDB;
    word-break:keep-all;overflow-wrap:anywhere;

  .det-item .tick{flex:0 0 auto;color:#8C8C8C;font-size:11px;line-height:1.7}
  .det-text{flex:1 1 auto;min-width:0}
  .det-time{flex:0 0 auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1.7}
  .det-empty{font-size:12.5px;color:var(--faint);padding:16px 0 8px;text-align:center;line-height:1.6}

  .foot-row{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:9px}
  .foot{margin:0;font-size:11px;line-height:1.7;color:#4A4A4A;text-align:center}
  .refresh-btn{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:500;letter-spacing:.04em;color:#484848;
    padding:5px 10px;border-radius:999px;border:1px solid transparent;
    transition:color .16s ease,border-color .16s ease,opacity .16s ease;
  }
  .refresh-btn:active{color:#B4B4B4;border-color:#2A2A2A}
  .refresh-btn:disabled{opacity:.55}

  /* ---------- gacha (star skin) ---------- */
  #gachaOverlay{z-index:54}
  .gacha-sheet{max-height:92dvh;padding:16px 14px 14px;-webkit-overflow-scrolling:touch}
  .gacha-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 13px}
  .gacha-title{font-size:14px;font-weight:600;letter-spacing:.06em;color:#EDEDED}
  .g-test{
    display:inline-flex;align-items:center;gap:5px;margin:-5px 2px 11px;
    padding:5px 10px;border-radius:999px;border:1px dashed #3C3C3C;background:#141414;
    font-size:10px;font-weight:500;letter-spacing:.05em;color:#B6B6B6;
  }
  .g-test b{font-weight:800;color:#FFFFFF;letter-spacing:.06em}
  .g-test:active{border-color:#5A5A5A;color:#EDEDED}
  .gacha-close{width:30px;height:30px;border-radius:9px;border:1px solid transparent;color:var(--dim);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
  .gacha-close:active{color:var(--text)}
  .g-wallet{display:flex;align-items:center;gap:13px;background:#131313;border:1px solid #242424;border-radius:14px;padding:12px 14px}
  .g-w-item{display:flex;align-items:baseline;gap:6px;min-width:0}
  .g-w-num{font-size:17px;font-weight:700;color:#FFFFFF;font-variant-numeric:tabular-nums;line-height:1.1}
  .g-w-label{font-size:10.5px;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
  .g-w-sep{width:1px;height:17px;background:#2C2C2C}
  .g-w-owned{margin-left:auto;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .g-stage{
    position:relative;margin-top:12px;min-height:132px;padding:16px 14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    border:1px solid #232323;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#151515 0%,#0F0F0F 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .g-stage.spinning{border-color:#333333}
  .g-idle{font-size:11.5px;line-height:1.6;color:var(--faint);text-align:center;max-width:250px}
  .g-res{display:flex;flex-direction:column;align-items:center;gap:5px;animation:gPop .42s cubic-bezier(.2,.9,.25,1) both}
  @keyframes gPop{0%{opacity:0;transform:scale(.72)}62%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  .g-res-star{line-height:0}
  .g-res-star svg{width:42px;height:42px;display:block}
  .g-res-name{font-size:17px;font-weight:700;color:#FCFCFC;letter-spacing:-.01em;margin-top:2px}
  .g-res-meta{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .g-res-tag{font-size:11px;color:#DCDCDC;background:#1E1E1E;border:1px solid #303030;border-radius:999px;padding:4px 11px;margin-top:3px}
  .g-res-tag.dup{color:#AEAEAE;background:#171717;border-color:#262626}
  .g-spin{position:relative;width:66px;height:66px;display:flex;align-items:center;justify-content:center}
  .g-spin svg{width:32px;height:32px;display:block;filter:drop-shadow(0 0 14px rgba(255,255,255,.5));animation:gSpin .95s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes gSpin{0%{transform:rotate(0deg) scale(.86)}50%{transform:rotate(180deg) scale(1.08)}100%{transform:rotate(360deg) scale(.86)}}
  .g-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.28);animation:gRing 1.5s ease-out infinite}
  .g-ring.r2{animation-delay:.75s}
  @keyframes gRing{0%{transform:scale(.35);opacity:.85}100%{transform:scale(1.3);opacity:0}}
  .g-draw{width:100%;margin-top:10px;min-height:50px;font-size:15px;border-radius:14px}
  .g-draw:disabled{background:#1B1B1B;color:#5C5C5C;transform:none}
  .g-exchange{
    display:block;width:100%;margin-top:7px;padding:11px 10px;
    font-size:11.5px;font-weight:500;letter-spacing:.02em;
    color:#D6D6D6;background:#161616;border:1px solid #2E2E2E;border-radius:12px;
    transition:color .16s ease,border-color .16s ease,opacity .16s ease,transform .12s ease;
  }
  .g-exchange:active{transform:scale(.99);border-color:#454545}
  .g-exchange:disabled{color:#585858;background:#121212;border-color:#212121}
  .g-sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 9px}
  .g-sec h3{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .g-sec span{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .g-card{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
    background:#151515;border:1px solid #232323;border-radius:14px;
    padding:13px 5px 10px;transition:transform .12s ease,border-color .16s ease,background .16s ease;
  }
  .g-card:active{transform:scale(.97)}
  .g-card.owned{border-color:#2E2E2E;background:#161616}
  .g-card.equipped{border-color:#5C5C5C;background:#1D1D1D;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .g-card.locked{opacity:.62}
  .g-card.locked:active{transform:none}
  .g-card.equipped::after{content:"✓";position:absolute;top:5px;right:7px;font-size:9px;line-height:1;color:#FFFFFF}
  .g-star{line-height:0}
  .g-star svg{width:22px;height:22px;display:block}
  .g-name{font-size:10.5px;line-height:1.3;color:#E2E2E2;text-align:center;letter-spacing:-.01em;word-break:keep-all}
  .g-card.locked .g-name{color:#6F6F6F;letter-spacing:.12em}
  .g-rarity{font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6A6A6A}
  .g-card[data-r="rare"] .g-rarity{color:#8E8E8E}
  .g-card[data-r="epic"] .g-rarity{color:#BDBDBD}
  .g-card[data-r="legendary"] .g-rarity{color:#EDEDED}
  .g-hint{margin:13px 0 2px;font-size:10.5px;line-height:1.6;color:#4E4E4E;text-align:center}

  /* ---------- update notice ---------- */
  .upd-overlay{align-items:center;z-index:58;padding:0 18px calc(env(safe-area-inset-bottom) + 18px)}
  .upd-card{
    width:100%;max-width:400px;
    background:linear-gradient(180deg,#161616 0%,#101010 100%);
    border:1px solid #2C2C2C;border-radius:20px;padding:20px 18px 16px;
    box-shadow:0 24px 64px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.05);
    transform:translateY(10px) scale(.985);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .cal-overlay.open .upd-card{transform:translateY(0) scale(1)}
  .upd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .upd-title{font-size:14.5px;font-weight:700;letter-spacing:.02em;color:#F2F2F2}
  .upd-ver{font-size:10px;font-weight:600;letter-spacing:.08em;color:#8C8C8C;background:#1D1D1D;border:1px solid #2E2E2E;border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums}
  .upd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .upd-list li{position:relative;padding-left:15px;font-size:12.5px;line-height:1.6;color:#D2D2D2;word-break:keep-all;overflow-wrap:anywhere}
  .upd-list li::before{content:"✦";position:absolute;left:0;top:0;font-size:8.5px;line-height:2.1;color:#6E6E6E}
  .upd-ok{width:100%;margin-top:16px;min-height:46px;font-size:14px;border-radius:13px}
</style>
</head>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  }

  function hasRecord(e) {
    return !!(e && ((e.focusDone && e.focusDone.length) || (e.routinesDone && e.routinesDone.length)));
  }

  /* ---------- toast ---------- */

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  function toastKey(key) { toast(t(key)); }

  function elapsedText() {
    if (!state.goal || !state.goalStartedAt) return '';
    var m = Math.floor((Date.now() - state.goalStartedAt) / 60000);
    if (lang === 'ja') {
      if (m < 1) return t('justStarted');
      if (m < 60) return m + t('minPassed');
      var jh = Math.floor(m / 60);
      return jh + t('hourPassed') + (m % 60) + t('minPassed');
    }
    if (m < 1) return t('justStarted');
    if (m < 60) return m + t('minPassed');
    var h = Math.floor(m / 60);
    return h + t('hourPassed') + (m % 60) + t('minPassed');
  }

  /* ---------- gacha (star skins) ---------- */

  function skinById(id) {
    for (var i = 0; i < SKINS.length; i++) if (SKINS[i].id === id) return SKINS[i];
    return null;
  }

  function skinName(s) {
    if (!s) return '';
    return lang === 'ja' ? s.ja : s.ko;
  }

  function rarityName(r) {
    var o = RARITY[r];
    return o ? (lang === 'ja' ? o.ja : o.ko) : '';
  }

  function skinFill(s) {
    return s.fill || s.color;
  }

  // 스킨별 별 주변 이펙트 클래스 (헤더·도감 카드·결과창 공통)
  var SKIN_FX = {
    ash: 'fx-spark', gold: 'fx-spark', aurora: 'fx-spark',
    orbit: 'fx-orbit', stardust: 'fx-stardust', snow: 'fx-snow', crescent: 'fx-crescent'
  };

  function fxClass(id) {
    return SKIN_FX[id] ? ' ' + SKIN_FX[id] : '';
  }

  function starMark(fill) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR_PATH + '" fill="' + fill + '"/></svg>';
  }

  function gachaDefaults() {
    // 첫 접속: 웰컴 뽑기권 1장, 기본 스킨인 모노 화이트를 장착한 상태
    return { tickets: 1, shards: 0, owned: ['mono'], equipped: 'mono', lastTicketDate: null };
  }

  function loadGacha() {
    var base = gachaDefaults();
    var raw = null;
    try { raw = localStorage.getItem(GACHA_KEY); } catch (e) { return base; }
    if (!raw) return base;
    var s = null;
    try { s = JSON.parse(raw); } catch (e) { return base; }
    if (!s || typeof s !== 'object') return base;
    var g = gachaDefaults();
    if (typeof s.tickets === 'number' && s.tickets >= 0) g.tickets = Math.floor(s.tickets);
    if (typeof s.shards === 'number' && s.shards >= 0) g.shards = Math.floor(s.shards);
    var set = { mono: 1 };
    if (Array.isArray(s.owned)) {
      s.owned.forEach(function (id) { if (skinById(id)) set[id] = 1; });
    }
    g.owned = Object.keys(set);
    if (typeof s.equipped === 'string' && g.owned.indexOf(s.equipped) >= 0) g.equipped = s.equipped;
    if (typeof s.lastTicketDate === 'string') g.lastTicketDate = s.lastTicketDate;
    return g;
  }

  var gacha = loadGacha();
  var gachaOpen = false;
  var drawing = false;
  var lastResult = null;
  var gachaTest = null;   // 'unlock' | 'lock' | null — 루틴 추가 입력창의 비밀 코드로 켜진다

  function saveGacha() {
    try { localStorage.setItem(GACHA_KEY, JSON.stringify(gacha)); } catch (e) {}
  }

  function applySkin() {
    var id = gacha.equipped || 'mono';
    document.documentElement.setAttribute('data-skin', id);
    document.body.setAttribute('data-skin', id);
    var mark = $('brandMark');
    if (mark) mark.className = 'brand-mark fx' + fxClass(id);
  }

  function updateBrandBadge() {
    var dot = $('brandDot');
    if (dot) dot.hidden = gacha.tickets < 1;
  }

  function gachaCardHTML(s) {
    var owned = gacha.owned.indexOf(s.id) >= 0;
    var eq = gacha.equipped === s.id;
    var fill = owned ? skinFill(s) : '#232323';
    var cls = 'g-card' + (owned ? ' owned' : ' locked') + (eq ? ' equipped' : '');
    var label = owned ? skinName(s) : '???';
    var tappable = owned || gachaTest === 'unlock';
    return '<button class="' + cls + '" type="button" data-gs="' + s.id + '" data-r="' + s.rarity + '"' + (tappable ? '' : ' disabled') + ' aria-label="' + esc(label + ' · ' + rarityName(s.rarity)) + '">' +
      '<span class="g-star fx' + (owned ? fxClass(s.id) : '') + '"' + (owned ? ' style="filter:drop-shadow(0 0 7px ' + s.glow + ')"' : '') + '>' + starMark(fill) + '</span>' +
      '<span class="g-name">' + esc(label) + '</span>' +
      '<span class="g-rarity">' + esc(rarityName(s.rarity)) + '</span>' +
    '</button>';
  }

  function renderGachaResult(res) {
    var s = res.skin;
    $('gStage').innerHTML =
      '<div class="g-res">' +
        '<div class="g-res-star fx' + fxClass(s.id) + '" style="filter:drop-shadow(0 0 16px ' + s.glow + ')">' + starMark(skinFill(s)) + '</div>' +
        '<div class="g-res-name">' + esc(skinName(s)) + '</div>' +
        '<div class="g-res-meta">' + esc(rarityName(s.rarity)) + '</div>' +
        '<div class="g-res-tag' + (res.isNew ? '' : ' dup') + '">' + esc(t(res.isNew ? 'gNew' : 'gDup')) + '</div>' +
      '</div>';
  }

  function renderGacha() {
    $('gTickets').textContent = String(gacha.tickets);
    $('gShards').textContent = String(gacha.shards);
    $('gOwned').textContent = t('gOwned') + ' ' + gacha.owned.length + '/' + SKINS.length;
    $('gCount').textContent = gacha.owned.length + '/' + SKINS.length;

    var db = $('gDraw');
    db.textContent = drawing ? t('gDrawBusy') : t('gDraw');
    db.disabled = drawing || gacha.tickets < 1;

    var ex = $('gExchange');
    ex.disabled = gacha.shards < 3;
    ex.textContent = t('gExchange') + (gacha.shards < 3 ? ' · ' + gacha.shards + '/3' : '');

    $('gGrid').innerHTML = SKINS.map(gachaCardHTML).join('');

    var tb = $('gTest');
    if (gachaTest) {
      tb.hidden = false;
      tb.innerHTML = '<b>TEST ' + (gachaTest === 'unlock' ? '+' : '−') + '</b> ' +
        esc(t(gachaTest === 'unlock' ? 'gTestUnlock' : 'gTestLock')) + ' · ' + esc(t('gTestOff'));
    } else {
      tb.hidden = true;
      tb.textContent = '';
    }

    var stage = $('gStage');
    if (drawing) {
      stage.classList.add('spinning');
      stage.innerHTML = '<div class="g-spin">' + starMark('#FFFFFF') +
        '<span class="g-ring"></span><span class="g-ring r2"></span></div>';
      return;
    }
    stage.classList.remove('spinning');
    if (lastResult) renderGachaResult(lastResult);
    else stage.innerHTML = '<div class="g-idle">' + esc(t('gIdle')) + '</div>';
  }

  function openGacha() {
    gachaOpen = true;
    lastResult = null;
    drawing = false;
    var ov = $('gachaOverlay');
    ov.hidden = false;
    renderGacha();
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () { ov.classList.add('open'); });
    } else {
      ov.classList.add('open');
    }
    document.body.style.overflow = 'hidden';
  }

  function closeGacha() {
    if (!gachaOpen) return;
    gachaOpen = false;
    var ov = $('gachaOverlay');
    ov.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () { if (!gachaOpen) ov.hidden = true; }, 240);
  }

  function pickSkin() {
    var order = ['common', 'rare', 'epic', 'legendary'];
    var r = Math.random() * 100;
    var acc = 0;
    var tier = 'legendary';
    for (var i = 0; i < order.length; i++) {
      acc += TIER_CHANCE[order[i]];
      if (r < acc) { tier = order[i]; break; }
    }
    var inTier = SKINS.filter(function (s) { return s.rarity === tier; });
    return inTier[Math.floor(Math.random() * inTier.length)] || SKINS[1];
  }

  function drawOnce() {
    if (drawing) return;
    if (gacha.tickets < 1) { toastKey('gNoTicket'); return; }
    drawing = true;
    lastResult = null;
    gacha.tickets -= 1;
    saveGacha();
    renderGacha();
    updateBrandBadge();
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }

    setTimeout(function () {
      var skin = pickSkin();
      var isNew = gacha.owned.indexOf(skin.id) < 0;
      if (isNew) {
        gacha.owned.push(skin.id);
        gacha.equipped = skin.id;   // 새 스킨은 바로 장착
      } else {
        gacha.shards += 1;
      }
      saveGacha();
      applySkin();
      updateBrandBadge();
      drawing = false;
      lastResult = { skin: skin, isNew: isNew };
      renderGacha();
      if (navigator.vibrate) { try { navigator.vibrate(isNew ? [12, 40, 18] : 14); } catch (e) {} }
    }, 980);
  }

  function equipSkin(id) {
    if (gacha.owned.indexOf(id) < 0) return;
    if (gacha.equipped === id) { toastKey('gEquipped'); return; }
    gacha.equipped = id;
    saveGacha();
    applySkin();
    renderGacha();
    var s = skinById(id);
    toast(skinName(s) + ' · ' + t('gEquipDone'));
  }

  function exchangeShards() {
    if (gacha.shards < 3) return;
    gacha.shards -= 3;
    gacha.tickets += 1;
    saveGacha();
    renderGacha();
    updateBrandBadge();
    toastKey('gExchanged');
  }

  /* 테스트 모드 — 루틴 추가 입력창에 ★ 또는 ★- 를 넣고 추가를 누르면 켜진다 (성윤 님 전용 치트) */

  function setTestMode(mode) {
    gachaTest = mode;
    if (gachaOpen) renderGacha();
    toastKey(mode === 'unlock' ? 'toastTestUnlock' : 'toastTestLock');
  }

  function clearTestMode() {
    gachaTest = null;
    if (gachaOpen) renderGacha();
    toastKey('toastTestOff');
  }

  // 편집 중인 루틴 입력값에서 치트 코드를 찾으면 그 줄을 지우고 모드를 켜다
  function takeCheatCode() {
    if (!draft) return false;
    for (var i = 0; i < draft.length; i++) {
      var v = (draft[i].text || '').trim();
      if (v === '★' || v === '★-') {
        draft.splice(i, 1);
        renderRoutines();
        setTestMode(v === '★' ? 'unlock' : 'lock');
        return true;
      }
    }
    return false;
  }

  function testTapSkin(id) {
    var s = skinById(id);
    if (!s) return;
    if (gachaTest === 'unlock') {
      if (gacha.owned.indexOf(id) >= 0) { equipSkin(id); return; }
      gacha.owned.push(id);
      saveGacha();
      renderGacha();
      toast(skinName(s) + ' · ' + t('gUnlocked'));
      return;
    }
    if (gachaTest === 'lock') {
      if (id === 'mono' || gacha.owned.indexOf(id) < 0) return;
      gacha.owned = gacha.owned.filter(function (x) { return x !== id; });
      if (gacha.equipped === id) gacha.equipped = 'mono';
      saveGacha();
      applySkin();
      renderGacha();
      toast(skinName(s) + ' · ' + t('gLocked'));
    }
  }

  // 루틴을 그날 모두 체크했을 때 뽑기권 1장 (하루 1회)
  function maybeAwardTicket() {
    var total = state.routines.length;
    if (total < 1) return;
    var done = state.routines.filter(function (r) { return r.done; }).length;
    if (done !== total) return;
    var tk = todayKey();
    if (gacha.lastTicketDate === tk) return;
    gacha.lastTicketDate = tk;
    gacha.tickets += 1;
    saveGacha();
    updateBrandBadge();
    if (gachaOpen) renderGacha();
    toastKey('toastTicket');
  }

  /* ---------- refresh ---------- */

  function refreshApp() {
    var btn = $('refreshBtn');
    if (btn) btn.disabled = true;
    var done = false;
    var go = function () { if (done) return; done = true; location.reload(); };
    if (!('serviceWorker' in navigator)) { go(); return; }
    var regs;
    try {
      regs = navigator.serviceWorker.getRegistrations
        ? navigator.serviceWorker.getRegistrations()
        : Promise.resolve([]);
    } catch (e) { go(); return; }
    Promise.resolve(regs).then(function (list) {
      return Promise.all(list.map(function (r) {
        return r.update().catch(function () {});
      }));
    }).then(go).catch(go);
    setTimeout(go, 1800);   // 서비스 워커 응답이 늦어도 새로고침
  }

  /* ---------- update notice ---------- */

  var updateOpen = false;

  function readSeenVersion() {
    try { return localStorage.getItem(SEEN_VERSION_KEY) || ''; } catch (e) { return APP_VERSION; }
  }

  function markVersionSeen() {
    try { localStorage.setItem(SEEN_VERSION_KEY, APP_VERSION); } catch (e) {}
  }

  function renderUpdate() {
    $('updVer').textContent = 'v' + APP_VERSION;
    var entry = CHANGELOG[APP_VERSION];
    var list = (entry && (lang === 'ja' ? entry.ja : entry.ko)) || [];
    $('updList').innerHTML = list.map(function (line) {
      return '<li>' + esc(String(line).replace(/^✦\s*/, '')) + '</li>';
    }).join('');
  }

  function openUpdate() {
    updateOpen = true;
    var ov = $('updateOverlay');
    ov.hidden = false;
    renderUpdate();
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () { ov.classList.add('open'); });
    } else {
      ov.classList.add('open');
    }
    document.body.style.overflow = 'hidden';
  }

  function closeUpdate() {
    if (!updateOpen) return;
    updateOpen = false;
    markVersionSeen();
    var ov = $('updateOverlay');
    ov.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () { if (!updateOpen) ov.hidden = true; }, 240);
  }

  /* ---------- focus slot ---------- */

  function renderFocus() {
    var region = $('focusRegion');
    var tc = $('todayCount');
    tc.textContent = state.todayCount > 0 ? t('todayDone') + ' ' + state.todayCount : '';

    if (state.goal) {
      region.innerHTML =
        '<div class="focus-card" id="focusCard">' +
          '<div class="card-top">' +
            '<span class="tag">' + STAR + 'FOCUS</span>' +
            '<span class="elapsed" id="elapsed">' + esc(elapsedText()) + '</span>' +
          '</div>' +
          '<p class="goal-text">' + esc(state.goal.text) + '</p>' +
          '<div class="actions">' +
            '<button class="btn-primary" type="button" data-act="complete">' + esc(t('complete')) + '</button>' +
            '<button class="btn-ghost" type="button" data-act="edit">' + esc(t('edit')) + '</button>' +
            '<button class="btn-ghost" type="button" data-act="clear">' + esc(t('clear')) + '</button>' +
          '</div>' +
        '</div>';
    } else {
      region.innerHTML =
        '<form class="compose" id="composeForm" autocomplete="off">' +
          '<input id="goalInput" placeholder="' + esc(t('goalPh')) + '" maxlength="120" enterkeyhint="go" aria-label="' + esc(t('goalPh')) + '">' +
          '<button class="btn-primary" type="submit">' + esc(t('start')) + '</button>' +
        '</form>';
    }
  }

  function renderGoalEdit() {
    var region = $('focusRegion');
    region.innerHTML =
      '<form class="focus-card" id="goalEditForm">' +
        '<div class="card-top"><span class="tag">' + STAR + esc(t('edit')) + '</span></div>' +
        '<input class="goal-edit-input" id="goalEditInput" maxlength="120" value="' + esc(state.goal ? state.goal.text : '') + '" aria-label="' + esc(t('goalEdit')) + '">' +
        '<div class="actions">' +
          '<button class="btn-primary" type="submit">' + esc(t('save')) + '</button>' +
          '<button class="btn-ghost" type="button" data-act="cancelEdit">' + esc(t('cancel')) + '</button>' +
        '</div>' +
      '</form>';
    var input = $('goalEditInput');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }

  function setGoal(text) {
    text = (text || '').trim();
    if (!text) return false;
    if (state.goal && state.goal.text === text) { toastKey('toastSame'); return true; }
    if (state.goal) state.queue.unshift(state.goal.text);
    state.goal = { text: text };
    state.goalStartedAt = Date.now();
    save();
    renderAll();
    return true;
  }

  function completeGoal() {
    if (!state.goal || completing) return;
    completing = true;
    var card = $('focusCard');
    if (card) card.classList.add('leaving');
    setTimeout(function () {
      var doneText = state.goal.text;
      state.focusDone.push({ text: doneText, completedAt: Date.now() });
      state.goal = null;
      state.goalStartedAt = null;
      state.todayCount = state.focusDone.length;
      syncToday();
      save();
      completing = false;
      renderAll();
      toastKey('toastDone');
      if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
    }, 230);
  }

  /* ---------- queue ---------- */

  function renderQueue() {
    var list = $('queueList');
    $('queueCount').textContent = String(state.queue.length);
    list.innerHTML = state.queue.map(function (txt, i) {
      return '<li class="q-item">' +
        '<span class="q-text">' + esc(txt) + '</span>' +
        '<button class="q-btn up" type="button" data-q="up" data-i="' + i + '" aria-label="' + esc(t('raise')) + '">↑</button>' +
        '<button class="q-btn" type="button" data-q="del" data-i="' + i + '" aria-label="' + esc(t('queueDel')) + '">✕</button>' +
      '</li>';
    }).join('');
  }

  /* ---------- routines ---------- */

  function renderRoutines() {
    var list = $('routineList');
    var total = state.routines.length;
    var done = state.routines.filter(function (r) { return r.done; }).length;
    var prog = $('progLabel');
    prog.textContent = done + '/' + total;
    prog.classList.toggle('full', total > 0 && done === total);
    $('barFill').style.width = total ? (done / total * 100) + '%' : '0%';

    $('editActions').hidden = !editMode;
    $('editBtn').hidden = editMode;

    if (editMode) {
      list.innerHTML = draft.map(function (r, i) {
        return '<li class="r-edit">' +
          '<input class="r-input" data-i="' + i + '" maxlength="80" value="' + esc(draftLabel(r)) + '" aria-label="' + esc(t('routineName')) + '">' +
          '<button class="r-del" type="button" data-del="' + i + '" aria-label="' + esc(t('routineDel')) + '">✕</button>' +
        '</li>';
      }).join('');
    } else {
      list.innerHTML = state.routines.map(function (r) {
        return '<li>' +
          '<button class="r-item' + (r.done ? ' done' : '') + '" type="button" role="checkbox" aria-checked="' + (r.done ? 'true' : 'false') + '" data-toggle="' + r.id + '">' +
            '<span class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.2 5L20 6.5" stroke="#0A0A0A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
            '<span class="r-text">' + esc(routineLabel(r)) + '</span>' +
          '</button>' +
        '</li>';
      }).join('');
    }
  }

  function normalizeRoutine(r) {
    var text = (r.text || '').trim();
    var dk = (typeof r.dk === 'number') ? r.dk : -1;
    if (dk < 0) dk = DEFAULT_ROUTINES.indexOf(text);
    if (dk >= 0 && (text === DEFAULT_ROUTINES[dk] || text === DEFAULT_ROUTINES_JA[dk])) {
      return { id: r.id, text: DEFAULT_ROUTINES[dk], dk: dk, done: !!r.done };
    }
    return { id: r.id, text: text, done: !!r.done };
  }

  /* ---------- header date ---------- */

  function dateLabelText() {
    var d = new Date();
    return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + WEEK[lang][d.getDay()];
  }

  /* ---------- calendar ---------- */

  var cal = { y: 0, m: 0, sel: null, isOpen: false };

  function renderCalWeek() {
    $('calWeek').innerHTML = WEEK[lang].map(function (w) { return '<span>' + w + '</span>'; }).join('');
  }

  function renderCal() {
    var y = cal.y, m = cal.m;
    var startDow = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var tk = todayKey();
    var html = '';
    for (var i = 0; i < startDow; i++) {
      html += '<button class="cal-day blank" type="button" tabindex="-1" aria-hidden="true"></button>';
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var key = y + '-' + pad2(m + 1) + '-' + pad2(d);
      var e = entryFor(key);
      var cls = 'cal-day';
      if (key === tk) cls += ' today';
      if (key === cal.sel) cls += ' sel';
      if (hasRecord(e)) cls += ' has';
      var aria = (lang === 'ja') ? ((m + 1) + '月' + d + '日') : ((m + 1) + '월 ' + d + '일');
      html += '<button class="' + cls + '" type="button" data-day="' + key + '" aria-label="' + esc(aria) + '">' +
        '<span>' + d + '</span><i class="dot"></i></button>';
    }
    $('calGrid').innerHTML = html;
    $('calMonth').textContent = (lang === 'ja') ? (y + '年' + (m + 1) + '月') : (y + '년 ' + (m + 1) + '월');
    renderCalWeek();
    renderCalDetail();
  }

  function renderCalDetail() {
    var wrap = $('calDetail');
    if (!cal.sel) { wrap.innerHTML = ''; return; }
    var parts = cal.sel.split('-');
    var y = parseInt(parts[0], 10), mo = parseInt(parts[1], 10), da = parseInt(parts[2], 10);
    var dt = new Date(y, mo - 1, da);
    var wd = WEEK[lang][dt.getDay()];
    var title = (lang === 'ja')
      ? (mo + '月' + da + '日（' + wd + '）')
      : (mo + '월 ' + da + '일 (' + wd + ')');

    var e = entryFor(cal.sel);
    var focusList = (e && e.focusDone) ? e.focusDone : [];
    var routinesDone = (e && e.routinesDone) ? e.routinesDone : [];
    var routineTotal = (e && typeof e.routineTotal === 'number') ? e.routineTotal : state.routines.length;

    var html = '<div class="cal-date">' + esc(title) + '</div>';

    if (!focusList.length && !routinesDone.length) {
      html += '<div class="det-empty">' + esc(t('calEmpty')) + '</div>';
      wrap.innerHTML = html;
      return;
    }

    if (focusList.length) {
      html += '<p class="det-label">' + esc(t('calFocus')) + '</p><ul class="det-list">';
      focusList.forEach(function (f) {
        var tm = timeHM(f.completedAt);
        html += '<li class="det-item"><span class="tick">✓</span>' +
          '<span class="det-text">' + esc(f.text) + '</span>' +
          (tm ? '<span class="det-time">' + tm + '</span>' : '') +
        '</li>';
      });
      html += '</ul>';
    }

    if (routineTotal > 0) {
      var full = routinesDone.length >= routineTotal;
      html += '<div class="det-row">' +
        '<p class="det-label">' + esc(t('calRoutines')) + '</p>' +
        '<span class="det-count' + (full ? ' full' : '') + '">' + routinesDone.length + '/' + routineTotal + '</span>' +
      '</div>';
      if (routinesDone.length) {
        html += '<ul class="det-list">';
        routinesDone.forEach(function (name) {
          html += '<li class="det-item"><span class="tick">✓</span><span class="det-text">' +
            esc(routineNameJa(name)) + '</span></li>';
        });
        html += '</ul>';
      } else {
        html += '<div class="det-empty" style="padding-top:2px">' + esc(lang === 'ja' ? 'まだチェックはありません' : '아직 체크한 루틴이 없어요') + '</div>';
      }
    }

    wrap.innerHTML = html;
  }

  function openCal() {
    var d = new Date();
    cal.y = d.getFullYear();
    cal.m = d.getMonth();
    cal.sel = todayKey();
    cal.isOpen = true;
    var ov = $('calOverlay');
    ov.hidden = false;
    renderCal();
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () { ov.classList.add('open'); });
    } else {
      ov.classList.add('open');
    }
    document.body.style.overflow = 'hidden';
  }

  function closeCal() {
    if (!cal.isOpen) return;
    cal.isOpen = false;
    var ov = $('calOverlay');
    ov.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () { if (!cal.isOpen) ov.hidden = true; }, 240);
  }

  function shiftMonth(delta) {
    var m = cal.m + delta;
    var y = cal.y;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    cal.y = y; cal.m = m;
    renderCal();
  }

  /* ---------- render all ---------- */

  function applyStaticI18n() {
    document.documentElement.lang = (lang === 'ja') ? 'ja' : 'ko';
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    }
    var phs = document.querySelectorAll('[data-i18n-ph]');
    for (var j = 0; j < phs.length; j++) {
      phs[j].setAttribute('placeholder', t(phs[j].getAttribute('data-i18n-ph')));
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var k = 0; k < arias.length; k++) {
      arias[k].setAttribute('aria-label', t(arias[k].getAttribute('data-i18n-aria')));
    }
    var btns = document.querySelectorAll('.lang-btn');
    for (var b = 0; b < btns.length; b++) {
      btns[b].setAttribute('aria-pressed', btns[b].getAttribute('data-lang') === lang ? 'true' : 'false');
    }
  }

  function renderAll() {
    $('dateLabel').textContent = dateLabelText();
    renderFocus();
    renderQueue();
    renderRoutines();
    if (cal.isOpen) renderCal();
    if (gachaOpen) renderGacha();
    if (updateOpen) renderUpdate();
  }

  function setLang(next) {
    if (next !== 'ko' && next !== 'ja') return;
    if (lang === next) return;
    lang = next;
    saveLang();
    if (editMode && draft) {
      // 편집 중이면 입력값을 지금 언어 표기로 다시 그린다
      renderRoutines();
    }
    applyStaticI18n();
    renderAll();
  }

  /* ---------- events ---------- */

  document.querySelector('.lang').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-lang]');
    if (!btn) return;
    setLang(btn.getAttribute('data-lang'));
  });

  $('dateBtn').addEventListener('click', openCal);
  $('brandBtn').addEventListener('click', openGacha);
  $('gachaClose').addEventListener('click', closeGacha);
  $('gachaOverlay').addEventListener('click', function (e) {
    if (e.target === $('gachaOverlay')) closeGacha();
  });
  $('gDraw').addEventListener('click', drawOnce);
  $('gExchange').addEventListener('click', exchangeShards);
  $('gGrid').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-gs]');
    if (!btn) return;
    var id = btn.getAttribute('data-gs');
    if (gachaTest) { testTapSkin(id); return; }
    equipSkin(id);
  });
  $('gTest').addEventListener('click', clearTestMode);
  $('refreshBtn').addEventListener('click', refreshApp);
  $('updOk').addEventListener('click', closeUpdate);
  $('updateOverlay').addEventListener('click', function (e) {
    if (e.target === $('updateOverlay')) closeUpdate();
  });
  $('calClose').addEventListener('click', closeCal);
  $('calPrev').addEventListener('click', function () { shiftMonth(-1); });
  $('calNext').addEventListener('click', function () { shiftMonth(1); });
  $('calOverlay').addEventListener('click', function (e) {
    if (e.target === $('calOverlay')) closeCal();
  });
  $('calGrid').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-day]');
    if (!btn) return;
    cal.sel = btn.getAttribute('data-day');
    var p = cal.sel.split('-');
    cal.y = parseInt(p[0], 10);
    cal.m = parseInt(p[1], 10) - 1;
    renderCal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && cal.isOpen) closeCal();
    if (e.key === 'Escape' && gachaOpen) closeGacha();
    if (e.key === 'Escape' && updateOpen) closeUpdate();
  });

  $('focusRegion').addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'composeForm') {
      var input = $('goalInput');
      if (setGoal(input ? input.value : '')) {
        toastKey('toastStart');
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
      } else if (input) {
        input.focus();
        toastKey('toastNeedOne');
      }
    } else if (e.target.id === 'goalEditForm') {
      var v = $('goalEditInput');
      var text = v ? v.value.trim() : '';
      if (!text) { renderFocus(); return; }
      state.goal = { text: text };
      save();
      renderAll();
      toastKey('toastEdited');
    }
  });

  $('focusRegion').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'complete') completeGoal();
    else if (act === 'edit') renderGoalEdit();
    else if (act === 'cancelEdit') renderFocus();
    else if (act === 'clear') {
      state.goal = null;
      state.goalStartedAt = null;
      save();
      renderAll();
      toastKey('toastCleared');
    }
  });

  $('queueForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('queueInput');
    var v = input ? input.value.trim() : '';
    if (!v) return;
    state.queue.push(v);
    save();
    renderQueue();
    input.value = '';
    $('queueDrawer').open = true;
    toastKey('toastQueued');
  });

  $('queueList').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-q]');
    if (!btn) return;
    var i = parseInt(btn.getAttribute('data-i'), 10);
    var kind = btn.getAttribute('data-q');
    if (isNaN(i) || !state.queue[i]) return;
    if (kind === 'up') {
      var text = state.queue.splice(i, 1)[0];
      setGoal(text);
      toastKey('toastRaised');
    } else if (kind === 'del') {
      state.queue.splice(i, 1);
      save();
      renderQueue();
    }
  });

  $('routineList').addEventListener('click', function (e) {
    if (editMode) {
      var del = e.target.closest('[data-del]');
      if (del) {
        var di = parseInt(del.getAttribute('data-del'), 10);
        if (!isNaN(di)) {
          draft.splice(di, 1);
          renderRoutines();
        }
      }
      return;
    }
    var btn = e.target.closest('[data-toggle]');
    if (!btn) return;
    var id = btn.getAttribute('data-toggle');
    var r = state.routines.find(function (x) { return x.id === id; });
    if (!r) return;
    r.done = !r.done;
    syncToday();
    save();
    renderRoutines();
    if (r.done) {
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch (err) {} }
      maybeAwardTicket();
    }
  });

  $('routineList').addEventListener('input', function (e) {
    if (!editMode) return;
    var input = e.target.closest('.r-input');
    if (!input) return;
    var i = parseInt(input.getAttribute('data-i'), 10);
    if (!isNaN(i) && draft[i]) draft[i].text = input.value;
  });

  $('editBtn').addEventListener('click', function () {
    editMode = true;
    draft = state.routines.map(function (r) {
      var c = { id: r.id, text: r.text, done: r.done };
      if (typeof r.dk === 'number') c.dk = r.dk;
      return c;
    });
    renderRoutines();
  });

  $('cancelRoutines').addEventListener('click', function () {
    editMode = false;
    draft = null;
    renderRoutines();
  });

  $('addRoutine').addEventListener('click', function () {
    if (takeCheatCode()) return;
    draft.push({ id: uid(), text: '', done: false });
    renderRoutines();
    var inputs = $('routineList').querySelectorAll('.r-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  $('saveRoutines').addEventListener('click', function () {
    if (takeCheatCode()) return;
    var clean = draft.filter(function (r) { return r.text.trim(); }).map(normalizeRoutine);
    state.routines = clean;
    syncToday();
    save();
    editMode = false;
    draft = null;
    renderRoutines();
    if (cal.isOpen) renderCal();
    toastKey('toastSaved');
  });

  // 날짜 전환 감지
  function checkRollover() {
    if (state.date !== todayKey()) {
      saveDayEntry(state.date, todayEntry());   // 전날 기존 날짜 그대로 기록을 확정
      state.date = todayKey();
      state.routines.forEach(function (r) { r.done = false; });
      state.todayCount = 0;
      state.focusDone = [];
      save();
      renderAll();
      toastKey('toastNewDay');
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) checkRollover();
  });
  setInterval(checkRollover, 30000);

  // 경과 시간 갱신
  setInterval(function () {
    var el = $('elapsed');
    if (el) el.textContent = elapsedText();
  }, 20000);

  applyStaticI18n();
  applySkin();
  updateBrandBadge();
  syncToday();
  renderAll();

  // 이 버전의 소식을 아직 안 봤으면 한 번만 안내
  if (readSeenVersion() !== APP_VERSION) openUpdate();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
